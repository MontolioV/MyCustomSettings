<!DOCTYPE html>
<html>
<head>
  <title>WASM SIMD vs JS Benchmark</title>
  <style>
      body { font-family: system-ui; max-width: 900px; margin: 40px auto; padding: 20px; background: #1a1a2e; color: #eee; }
      button { padding: 10px 20px; margin: 5px; cursor: pointer; background: #4a4a8a; color: white; border: none; border-radius: 4px; font-size: 16px; }
      button:hover { background: #5a5a9a; }
      button:disabled { background: #333; cursor: not-allowed; }
      .results { margin-top: 20px; padding: 20px; background: #252540; border-radius: 8px; }
      table { width: 100%; border-collapse: collapse; margin-top: 10px; }
      th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid #444; }
      th { color: #aaa; }
      .fastest { color: #4ade80; font-weight: bold; }
      .slow { color: #fbbf24; }
      .slowest { color: #f87171; }
      select { padding: 8px; font-size: 14px; background: #252540; color: #eee; border: 1px solid #444; border-radius: 4px; }
      h1 { color: #818cf8; }
      .note { color: #888; font-size: 14px; margin-top: 15px; }
      #wasm-status { padding: 10px; border-radius: 4px; margin: 10px 0; }
      .wasm-ok { background: #064e3b; }
      .wasm-err { background: #7f1d1d; }
      .info { background: #1e3a5f; padding: 15px; border-radius: 8px; margin: 15px 0; }
  </style>
</head>
<body>
<h1>🚀 WASM SIMD vs JavaScript</h1>

<div class="info">
  <strong>What's different here:</strong>
  <ul style="margin: 10px 0; padding-left: 20px;">
    <li>WASM uses explicit SIMD (Vec4) - processes 4 particles per instruction</li>
    <li>Branchless bounce logic - no unpredictable branches</li>
    <li>Structure of Arrays (SoA) layout - optimal for SIMD</li>
  </ul>
</div>

<div id="wasm-status">Loading WASM...</div>

<div style="margin: 20px 0;">
  <label>Particles:
    <select id="count">
      <option value="100000">100,000</option>
      <option value="500000">500,000</option>
      <option value="400000" selected>400,000 (WASM max)</option>
    </select>
  </label>
  <label style="margin-left: 20px;">Iterations:
    <select id="iterations">
      <option value="100">100</option>
      <option value="500" selected>500</option>
      <option value="1000">1000</option>
    </select>
  </label>
  <button id="runBtn" onclick="runBenchmark()" disabled>Run Benchmark</button>
</div>

<div id="results" class="results" style="display: none;"></div>

<script>
  // ===== JS Implementations =====

  // JS Objects (winner from last test)
  function createParticlesObjects(count) {
    const particles = new Array(count);
    for (let i = 0; i < count; i++) {
      particles[i] = { x: i % 800, y: i % 600, vx: (i % 10) - 5, vy: (i % 10) - 5 };
    }
    return {
      update() {
        for (let i = 0; i < count; i++) {
          const p = particles[i];
          p.x += p.vx;
          p.y += p.vy;
          if (p.x < 0 || p.x > 800) p.vx = -p.vx;
          if (p.y < 0 || p.y > 600) p.vy = -p.vy;
        }
      }
    };
  }

  // JS SoA with branchless (fair comparison)
  function createParticlesSoABranchless(count) {
    const x = new Float32Array(count);
    const y = new Float32Array(count);
    const vx = new Float32Array(count);
    const vy = new Float32Array(count);
    for (let i = 0; i < count; i++) {
      x[i] = i % 800; y[i] = i % 600;
      vx[i] = (i % 10) - 5; vy[i] = (i % 10) - 5;
    }
    return {
      update() {
        for (let i = 0; i < count; i++) {
          x[i] += vx[i];
          y[i] += vy[i];
          // Branchless: multiply by -1 if out of bounds
          const xOut = (x[i] < 0 || x[i] > 800) ? -1 : 1;
          const yOut = (y[i] < 0 || y[i] > 600) ? -1 : 1;
          vx[i] *= xOut;
          vy[i] *= yOut;
        }
      }
    };
  }

  // JS attempting manual "vectorization" (unrolled loop)
  function createParticlesUnrolled(count) {
    const x = new Float32Array(count);
    const y = new Float32Array(count);
    const vx = new Float32Array(count);
    const vy = new Float32Array(count);
    for (let i = 0; i < count; i++) {
      x[i] = i % 800; y[i] = i % 600;
      vx[i] = (i % 10) - 5; vy[i] = (i % 10) - 5;
    }
    return {
      update() {
        let i = 0;
        const len = count - 3;
        // Process 4 at a time
        for (; i < len; i += 4) {
          x[i] += vx[i]; x[i+1] += vx[i+1]; x[i+2] += vx[i+2]; x[i+3] += vx[i+3];
          y[i] += vy[i]; y[i+1] += vy[i+1]; y[i+2] += vy[i+2]; y[i+3] += vy[i+3];

          vx[i] *= (x[i] < 0 || x[i] > 800) ? -1 : 1;
          vx[i+1] *= (x[i+1] < 0 || x[i+1] > 800) ? -1 : 1;
          vx[i+2] *= (x[i+2] < 0 || x[i+2] > 800) ? -1 : 1;
          vx[i+3] *= (x[i+3] < 0 || x[i+3] > 800) ? -1 : 1;

          vy[i] *= (y[i] < 0 || y[i] > 600) ? -1 : 1;
          vy[i+1] *= (y[i+1] < 0 || y[i+1] > 600) ? -1 : 1;
          vy[i+2] *= (y[i+2] < 0 || y[i+2] > 600) ? -1 : 1;
          vy[i+3] *= (y[i+3] < 0 || y[i+3] > 600) ? -1 : 1;
        }
        // Remainder
        for (; i < count; i++) {
          x[i] += vx[i]; y[i] += vy[i];
          vx[i] *= (x[i] < 0 || x[i] > 800) ? -1 : 1;
          vy[i] *= (y[i] < 0 || y[i] > 600) ? -1 : 1;
        }
      }
    };
  }

  // ===== WASM =====
  let wasm = null;

  async function loadWasm() {
    const statusEl = document.getElementById('wasm-status');
    const runBtn = document.getElementById('runBtn');

    try {
      const response = await fetch('particles_simd.wasm');
      if (!response.ok) throw new Error('particles_simd.wasm not found');

      const bytes = await response.arrayBuffer();
      const { instance } = await WebAssembly.instantiate(bytes, {});
      wasm = instance.exports;

      console.log('WASM exports:', Object.keys(wasm));
      const maxP = wasm.get_max_particles ? wasm.get_max_particles() : 'unknown';
      statusEl.textContent = '✓ WASM loaded (max particles: ' + maxP.toLocaleString() + ')';
      statusEl.className = 'wasm-ok';
      runBtn.disabled = false;
    } catch (e) {
      console.error(e);
      statusEl.textContent = '✗ WASM failed: ' + e.message;
      statusEl.className = 'wasm-err';
      runBtn.disabled = false;
    }
  }

  // ===== Benchmark =====
  function bench(name, setup, run, iterations) {
    const obj = setup();
    for (let i = 0; i < 5; i++) run(obj); // warmup

    const t0 = performance.now();
    for (let i = 0; i < iterations; i++) run(obj);
    const elapsed = performance.now() - t0;

    return { name, elapsed, perIter: elapsed / iterations };
  }

  function benchBatched(name, setup, runBatched, iterations) {
    const obj = setup();
    runBatched(obj, 10); // warmup

    const t0 = performance.now();
    runBatched(obj, iterations);
    const elapsed = performance.now() - t0;

    return { name, elapsed, perIter: elapsed / iterations };
  }

  async function runBenchmark() {
    const resultsDiv = document.getElementById('results');
    const runBtn = document.getElementById('runBtn');
    runBtn.disabled = true;
    resultsDiv.style.display = 'block';
    resultsDiv.innerHTML = '<p>Running benchmarks...</p>';

    await new Promise(r => setTimeout(r, 50));

    const count = parseInt(document.getElementById('count').value);
    const iterations = parseInt(document.getElementById('iterations').value);

    const results = [];

    // JS tests
    results.push(bench('JS: Array of Objects',
      () => createParticlesObjects(count), p => p.update(), iterations));

    results.push(bench('JS: SoA Branchless',
      () => createParticlesSoABranchless(count), p => p.update(), iterations));

    results.push(bench('JS: SoA Unrolled x4',
      () => createParticlesUnrolled(count), p => p.update(), iterations));

    // WASM tests
    if (wasm) {
      // Scalar WASM
      const initResult = wasm.init_particles(count);
      if (initResult < 0) {
        results.push({ name: 'WASM: Scalar', elapsed: 'N/A (count too high)', perIter: 0 });
        results.push({ name: 'WASM: SIMD', elapsed: 'N/A (count too high)', perIter: 0 });
      } else {
        results.push(benchBatched('WASM: Scalar (batched)',
          () => { wasm.init_particles(count); return wasm; },
          (w, n) => w.update_scalar_n(count, n),
          iterations));

        // SIMD WASM
        results.push(benchBatched('WASM: SIMD Vec4 (batched)',
          () => { wasm.init_particles(count); return wasm; },
          (w, n) => w.update_simd_n(count, n),
          iterations));
      }
    }

    // Sort and display
    results.sort((a, b) => a.elapsed - b.elapsed);
    const fastest = results[0].elapsed;

    resultsDiv.innerHTML = `
        <h3>Results: ${count.toLocaleString()} particles × ${iterations} iterations</h3>
        <table>
          <tr><th>#</th><th>Implementation</th><th>Total</th><th>Per Iter</th><th>Speed</th></tr>
          ${results.map((r, i) => {
      const ratio = r.elapsed / fastest;
      const cls = i === 0 ? 'fastest' : ratio > 2 ? 'slowest' : ratio > 1.3 ? 'slow' : '';
      return `<tr class="${cls}">
              <td>${i + 1}</td>
              <td>${r.name}</td>
              <td>${r.elapsed.toFixed(1)} ms</td>
              <td>${r.perIter.toFixed(3)} ms</td>
              <td>${ratio.toFixed(2)}x</td>
            </tr>`;
    }).join('')}
        </table>
        <p class="note">
          SIMD processes 4 floats per instruction. The branchless bounce avoids pipeline stalls.
        </p>
      `;

    runBtn.disabled = false;
  }

  loadWasm();
</script>
</body>
</html>
